/* ─── Reset / base ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
h1, h2, h3, p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

/* ─── Theme tokens ──────────────────────────────────────────────────────── */
:root {
  --font-body: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-display: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --radius: 0px;
  --radius-sm: 0px;
  --shadow: none;
  --shadow-strong: 0 12px 32px rgba(0,0,0,.12);
  --stripe-w: 6px;
}

/* ─── CLEAN theme (default, brief-aligned) ──────────────────────────────── */
html[data-theme="clean"] {
  --bg: #F5F5F7;
  --bg-2: #ECECEE;
  --fg: #111827;
  --fg-2: #6b7280;
  --fg-3: #9ca3af;
  --card: #ffffff;
  --card-hover: #fafafa;
  --border: #e5e7eb;
  --border-2: #d1d5db;
  --accent: #2563EB;
  --accent-fg: #ffffff;
  --danger: #dc2626;
  --header-bg: #ffffff;
  --tab-on: #111827;
  --tab-off: #6b7280;
  --tab-underline: #111827;
}
html[data-theme="clean"][data-dark="1"] {
  --bg: #0d0d0f;
  --bg-2: #18181b;
  --fg: #f4f4f6;
  --fg-2: #a1a1aa;
  --fg-3: #71717a;
  --card: #1a1a1d;
  --card-hover: #222226;
  --border: #2a2a2e;
  --border-2: #3a3a3e;
  --accent: #60a5fa;
  --accent-fg: #0d0d0f;
  --header-bg: #131316;
  --tab-on: #f4f4f6;
  --tab-off: #a1a1aa;
  --tab-underline: #f4f4f6;
}

/* ─── SWISS theme ────────────────────────────────────────────────────────── */
html[data-theme="swiss"] {
  --bg: #fafaf6;
  --bg-2: #f0efe9;
  --fg: #000000;
  --fg-2: #4a4a48;
  --fg-3: #8a8a86;
  --card: #ffffff;
  --card-hover: #fffcf5;
  --border: #000000;
  --border-2: #000000;
  --accent: #e63946;
  --accent-fg: #ffffff;
  --danger: #000000;
  --header-bg: #ffffff;
  --radius: 0px;
  --radius-sm: 0px;
  --tab-on: #000;
  --tab-off: #8a8a86;
  --tab-underline: #e63946;
  --font-display: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --stripe-w: 0px;
}
html[data-theme="swiss"][data-dark="1"] {
  --bg: #0a0a0a;
  --bg-2: #141414;
  --fg: #ffffff;
  --fg-2: #b4b4b0;
  --fg-3: #6a6a66;
  --card: #161616;
  --card-hover: #1e1e1e;
  --border: #ffffff;
  --border-2: #ffffff;
  --accent: #ff5468;
  --accent-fg: #0a0a0a;
  --header-bg: #0a0a0a;
  --tab-on: #fff;
  --tab-off: #6a6a66;
  --tab-underline: #ff5468;
}

/* ─── PLAYFUL theme ──────────────────────────────────────────────────────── */
html[data-theme="playful"] {
  --bg: #fff5e6;
  --bg-2: #ffe9c8;
  --fg: #2a1500;
  --fg-2: #6b4a1a;
  --fg-3: #a58850;
  --card: #ffffff;
  --card-hover: #fffcf5;
  --border: #2a1500;
  --border-2: #2a1500;
  --accent: #ff6a3d;
  --accent-fg: #ffffff;
  --danger: #c43a2a;
  --header-bg: #fffaf2;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 4px 0 #2a1500;
  --shadow-strong: 8px 8px 0 #2a1500;
  --tab-on: #2a1500;
  --tab-off: #6b4a1a;
  --tab-underline: #ff6a3d;
  --font-display: "Fraunces", "DM Sans", ui-serif, serif;
  --stripe-w: 10px;
}
html[data-theme="playful"][data-dark="1"] {
  --bg: #1a0d22;
  --bg-2: #2a1638;
  --fg: #fff0e0;
  --fg-2: #d8b8a8;
  --fg-3: #9a7e70;
  --card: #2e1840;
  --card-hover: #3a1f50;
  --border: #ff6a3d;
  --border-2: #ff6a3d;
  --accent: #ffb74d;
  --accent-fg: #1a0d22;
  --header-bg: #220f30;
  --shadow: 0 4px 0 #ff6a3d;
  --shadow-strong: 8px 8px 0 #ff6a3d;
  --tab-on: #fff0e0;
  --tab-off: #9a7e70;
  --tab-underline: #ffb74d;
}

/* ─── App shell ──────────────────────────────────────────────────────────── */
.dl-app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── Header ─────────────────────────────────────────────────────────────── */
.dl-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 28px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-header { border-bottom: 2px solid var(--fg); }
html[data-theme="playful"] .dl-header { border-bottom: 2px solid var(--border); }

.dl-header-left { display: flex; align-items: center; gap: 18px; min-width: 0; flex: 1; }
.dl-header-right { display: flex; align-items: center; gap: 12px; }

.dl-mark { color: var(--accent); display: flex; align-items: center; }
html[data-theme="swiss"] .dl-mark { color: var(--fg); }

.dl-title-block { display: flex; flex-direction: column; line-height: 1.1; }
.dl-eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}
html[data-theme="swiss"] .dl-eyebrow { color: var(--accent); }
html[data-theme="playful"] .dl-eyebrow { color: var(--accent); font-weight: 700; }

.dl-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  margin-top: 2px;
}
html[data-theme="swiss"] .dl-title { font-weight: 700; letter-spacing: -0.01em; }
html[data-theme="playful"] .dl-title { font-weight: 700; font-style: italic; }

.dl-count {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--fg-2);
  padding-left: 14px;
  border-left: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-count {
  font-family: var(--font-mono);
  border-left: 1px solid var(--fg);
  padding-left: 12px;
}

/* Search */
.dl-search {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  height: 36px;
  width: 280px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg-2);
}
html[data-theme="swiss"] .dl-search { border: 1px solid var(--fg); background: var(--card); }
html[data-theme="playful"] .dl-search { border: 2px solid var(--border); background: var(--card); }
.dl-search:focus-within { border-color: var(--fg-2); }
.dl-search input {
  flex: 1;
  height: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--fg);
  font-size: 13px;
  min-width: 0;
}
.dl-search input::placeholder { color: var(--fg-3); }
.dl-search-x {
  border: 0;
  background: transparent;
  color: var(--fg-2);
  padding: 4px;
  display: flex;
  align-items: center;
}
.dl-search-x:hover { color: var(--fg); }

/* Buttons */
.dl-btn-primary, .dl-btn-ghost, .dl-btn-danger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: transform 80ms ease;
}
.dl-btn-primary { background: var(--fg); color: var(--bg); }
.dl-btn-primary:hover { transform: translateY(-1px); }
html[data-theme="clean"] .dl-btn-primary { background: #111827; color: #fff; }
html[data-theme="clean"][data-dark="1"] .dl-btn-primary { background: #f4f4f6; color: #0d0d0f; }
html[data-theme="swiss"] .dl-btn-primary { background: var(--accent); color: var(--accent-fg); border-radius: 0; }
html[data-theme="playful"] .dl-btn-primary {
  background: var(--accent); color: var(--accent-fg);
  border: 2px solid var(--border); box-shadow: var(--shadow);
}
html[data-theme="playful"] .dl-btn-primary:hover { box-shadow: 0 2px 0 var(--border); transform: translate(2px, 2px); }

.dl-btn-ghost {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-btn-ghost { border: 1px solid var(--fg); }
html[data-theme="playful"] .dl-btn-ghost { border: 2px solid var(--border); }
.dl-btn-ghost:hover { background: var(--bg-2); }
.dl-btn-ghost:disabled { opacity: .5; cursor: not-allowed; }

.dl-btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-btn-danger { border: 1px solid var(--fg); color: var(--fg); text-decoration: underline; }
html[data-theme="playful"] .dl-btn-danger { border: 2px solid var(--danger); color: var(--danger); }
.dl-btn-danger:hover { background: color-mix(in oklab, var(--danger) 12%, transparent); }

.dl-icon-btn {
  border: 0;
  background: transparent;
  color: var(--fg-2);
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
}
.dl-icon-btn:hover { background: var(--bg-2); color: var(--fg); }

/* ─── Tabs ───────────────────────────────────────────────────────────────── */
.dl-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 28px 0;
  border-bottom: 1px solid var(--border);
  background: var(--header-bg);
  position: sticky;
  top: 69px;
  z-index: 20;
}
html[data-theme="swiss"] .dl-tabs { border-bottom: 2px solid var(--fg); top: 70px; }
.dl-tab {
  background: transparent;
  border: 0;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--tab-off);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  letter-spacing: 0;
}
html[data-theme="swiss"] .dl-tab { font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; font-size: 11px; padding: 12px 14px; margin-bottom: -2px; }
html[data-theme="playful"] .dl-tab { font-weight: 600; }
.dl-tab:hover { color: var(--fg); }
.dl-tab-on {
  color: var(--tab-on);
  border-bottom-color: var(--tab-underline);
  font-weight: 600;
}

/* ─── Toolbar / Filters ─────────────────────────────────────────────────── */
.dl-toolbar {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 28px 0;
  width: 100%;
}
.dl-filters {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.dl-filter {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px 0 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--fg);
  cursor: pointer;
}
html[data-theme="swiss"] .dl-filter { border: 1px solid var(--fg); border-radius: 0; }
html[data-theme="playful"] .dl-filter { border: 2px solid var(--border); }
.dl-filter:hover { background: var(--card-hover); }
.dl-filter-on { border-color: var(--accent); color: var(--accent); }
html[data-theme="swiss"] .dl-filter-on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.dl-filter-label { color: var(--fg-2); font-weight: 500; }
html[data-theme="swiss"] .dl-filter-label { font-family: var(--font-mono); text-transform: uppercase; font-size: 10px; letter-spacing: 0.06em; }
.dl-filter-on .dl-filter-label { color: inherit; opacity: .85; }
.dl-filter-value { font-weight: 600; }
.dl-filter-trigger { display: inline-flex; }
.dl-filter svg { color: var(--fg-3); }
.dl-filter-on svg { color: currentColor; }
.dl-filter select {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  font-size: 14px; /* keep iOS from zooming */
}

.dl-filter-clear {
  background: transparent;
  border: 0;
  color: var(--fg-2);
  font-size: 12px;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 6px 8px;
}
.dl-filter-clear:hover { color: var(--fg); }

/* Favorites chip */
.dl-filter-fav { color: var(--fg-2); }
.dl-filter-fav.is-on { background: color-mix(in oklab, #f5b800 16%, var(--card)); border-color: #f5b800; color: var(--fg); }
.dl-filter-fav.is-on svg { color: #f5b800; }
.dl-filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 6px;
  background: var(--bg-2);
  color: var(--fg-2);
  font-size: 10px;
  font-weight: 700;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.dl-filter-fav.is-on .dl-filter-count { background: #f5b800; color: #2a1a00; }

/* ─── Stats panel ───────────────────────────────────────────────────────── */
.dl-stats {
  margin-bottom: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
html[data-theme="swiss"] .dl-stats { border: 1px solid var(--fg); }
html[data-theme="playful"] .dl-stats { border: 2px solid var(--border); box-shadow: var(--shadow); }

.dl-stats-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: transparent;
  border: 0;
  color: var(--fg);
  text-align: left;
}
.dl-stats-toggle:hover { background: var(--card-hover); }

.dl-stats-summary {
  display: flex;
  align-items: center;
  gap: 24px;
  flex: 1;
  flex-wrap: wrap;
  min-width: 0;
}
.dl-stats-summary-stat {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  flex-shrink: 0;
}
.dl-stats-summary-stat.is-muted { opacity: .45; }
.dl-stats-summary-n {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.dl-stats-summary-n-sm {
  font-size: 13px;
  max-width: 180px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
}
.dl-stats-summary-l {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-3);
  margin-top: 2px;
}
html[data-theme="swiss"] .dl-stats-summary-l { font-family: var(--font-mono); }

/* Color composition strip */
.dl-stats-color-bar {
  display: flex;
  height: 10px;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
  border-radius: 999px;
  overflow: hidden;
  align-self: center;
  background: var(--bg-2);
}
html[data-theme="swiss"] .dl-stats-color-bar { border-radius: 0; box-shadow: inset 0 0 0 1px var(--fg); height: 8px; }
.dl-stats-color-seg { display: block; min-width: 1px; }

.dl-stats-chevron {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  color: var(--fg-2);
  flex-shrink: 0;
}

.dl-stats-body {
  padding: 4px 16px 18px;
  border-top: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-stats-body { border-top: 1px solid var(--fg); }

.dl-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
  margin-top: 12px;
}
@media (max-width: 980px) {
  .dl-stats-grid { grid-template-columns: 1fr; gap: 18px; }
}



.dl-stats-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dl-stats-group h4 {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  margin: 0;
}
html[data-theme="swiss"] .dl-stats-group h4 { font-family: var(--font-mono); }

.dl-stats-rows { display: flex; flex-direction: column; gap: 4px; }

.dl-stats-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 90px 64px;
  align-items: center;
  gap: 12px;
  padding: 6px 8px;
  background: transparent;
  border: 0;
  text-align: left;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--fg);
  font-size: 12px;
}
.dl-stats-row:hover { background: var(--bg-2); }
.dl-stats-row-static { cursor: default; }
.dl-stats-row-static:hover { background: transparent; }
.dl-stats-row-dim { opacity: .8; }

.dl-stats-row-name {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.dl-stats-swatch {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 999px;
  flex-shrink: 0;
}
html[data-theme="swiss"] .dl-stats-swatch { border-radius: 0; }

.dl-stats-row-bar {
  height: 6px;
  background: var(--bg-2);
  border-radius: 999px;
  overflow: hidden;
  display: block;
}
html[data-theme="swiss"] .dl-stats-row-bar { border-radius: 0; }
.dl-stats-row-bar > span { display: block; height: 100%; }

.dl-stats-row-count {
  font-variant-numeric: tabular-nums;
  color: var(--fg-2);
  font-size: 11px;
  text-align: right;
  font-weight: 600;
}
.dl-stats-row-pct { color: var(--fg-3); font-weight: 500; }

/* ─── Main ──────────────────────────────────────────────────────────────── */
.dl-main {
  flex: 1;
  padding: 20px 28px 64px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ─── Cards (list / category / color views) ─────────────────────────────── */
.dl-list { display: flex; flex-direction: column; gap: 8px; }

.dl-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 72px;
  padding: 0 12px 0 24px;
  overflow: hidden;
  transition: transform 80ms ease;
}
.dl-card:hover { background: var(--card-hover); }
html[data-theme="swiss"] .dl-card { border: 1px solid var(--fg); height: 76px; }
html[data-theme="playful"] .dl-card {
  border: 2px solid var(--border);
  padding: 0 12px 0 28px;
  height: 76px;
  box-shadow: var(--shadow);
}
html[data-theme="playful"] .dl-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border); }

.dl-card-stripe {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--stripe-w);
}
html[data-theme="swiss"] .dl-card-stripe { display: block; width: 8px; }

.dl-card-main {
  display: flex; flex-direction: column; gap: 4px;
  flex: 1;
  min-width: 0;
}
.dl-card-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
html[data-theme="swiss"] .dl-card-title { font-weight: 700; letter-spacing: -0.01em; }
html[data-theme="playful"] .dl-card-title { font-weight: 700; font-size: 16px; }

.dl-card-byline {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  font-size: 13px;
  line-height: 1.2;
}
.dl-card-author {
  color: var(--fg-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 0;
}
html[data-theme="swiss"] .dl-card-author { font-family: var(--font-mono); font-size: 12px; }

.dl-card-bullet {
  color: var(--fg-3);
  flex-shrink: 0;
}

.dl-card-cat {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
}
html[data-theme="swiss"] .dl-card-cat { font-family: var(--font-mono); letter-spacing: 0.06em; }
html[data-theme="playful"] .dl-card-cat { font-weight: 700; }

.dl-card-right {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 30%;
  min-width: 0;
}
.dl-card-notes {
  font-size: 12px;
  color: var(--fg-3);
  font-style: italic;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}
html[data-theme="swiss"] .dl-card-notes { font-family: var(--font-mono); font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }

.dl-card-edit {
  align-self: center;
  background: transparent;
  border: 0;
  color: var(--fg-3);
  padding: 8px;
  border-radius: var(--radius-sm);
  opacity: 0;
  transition: opacity 120ms ease, color 120ms ease;
  display: flex;
}
.dl-card:hover .dl-card-edit, .dl-card-edit:focus { opacity: 1; }
.dl-card-edit:hover { color: var(--fg); background: var(--bg-2); }

/* Star button on cards */
.dl-card-star {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  width: 30px; height: 30px;
  border-radius: 999px;
  color: var(--fg-3);
  opacity: 0;
  transition: opacity 120ms ease, color 120ms ease, background 120ms ease, transform 80ms ease;
  margin-left: 4px;
}
.dl-card:hover .dl-card-star { opacity: .9; }
.dl-card-star:hover { color: var(--fg); background: var(--bg-2); }
.dl-card-star.is-on { opacity: 1; color: #f5b800; }
.dl-card-star.is-on:hover { color: #f5b800; background: color-mix(in oklab, #f5b800 12%, transparent); }

/* Title row holds the title + a small quality marker. */
.dl-card-title-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.dl-card-quality {
  width: 6px; height: 6px; border-radius: 999px;
  background: var(--fg-3);
  opacity: .35;
  flex-shrink: 0;
  align-self: center;
}
html[data-theme="swiss"] .dl-card-quality { border-radius: 0; }

/* Density: compact tightens card height and font sizing. */
.dl-card[data-density="compact"] { height: 52px; padding: 0 12px 0 22px; }
html[data-theme="swiss"] .dl-card[data-density="compact"],
html[data-theme="playful"] .dl-card[data-density="compact"] { height: 54px; }
.dl-card[data-density="compact"] .dl-card-title { font-size: 13.5px; }
.dl-card[data-density="compact"] .dl-card-byline { font-size: 12px; }
.dl-card[data-density="compact"] .dl-card-cat { font-size: 10px; }
.dl-card[data-density="compact"] .dl-card-main { gap: 1px; }
.dl-list { gap: 8px; }
html[data-density="compact"] .dl-list { gap: 4px; }

/* Swatch dot */
.dl-dot {
  display: inline-block;
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
html[data-theme="swiss"] .dl-dot { border-radius: 0; box-shadow: inset 0 0 0 1px var(--fg); }

/* ─── Groups (category / color views) ───────────────────────────────────── */
.dl-grouped { display: flex; flex-direction: column; gap: 4px; }

/* Chip rail - horizontal navigation anchors above grouped sections */
.dl-chiprail {
  position: sticky;
  top: 113px; /* header (~69) + tabs (~44) */
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
html[data-theme="swiss"] .dl-chiprail { border-bottom: 1px solid var(--fg); }

.dl-chiprail-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex: 1;
  min-width: 0;
  scrollbar-width: thin;
  scroll-behavior: smooth;
  padding-bottom: 2px;
}
.dl-chiprail-scroll::-webkit-scrollbar { height: 6px; }
.dl-chiprail-scroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; }

.dl-chip {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 30px;
  padding: 0 12px;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}
html[data-theme="swiss"] .dl-chip {
  border: 1px solid var(--fg); border-radius: 0;
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
html[data-theme="playful"] .dl-chip { border: 2px solid var(--border); font-weight: 600; }
.dl-chip:hover { background: var(--bg-2); }
.dl-chip-on {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
}
.dl-chip-on:hover { background: var(--accent); }
.dl-chip-count {
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-3);
  padding-left: 2px;
}
html[data-theme="swiss"] .dl-chip-count { color: var(--fg-2); }
.dl-chip-on .dl-chip-count { color: color-mix(in oklab, var(--accent-fg) 70%, transparent); }

.dl-chiprail-actions { flex-shrink: 0; padding-right: 2px; }
.dl-chiprail-link {
  background: transparent;
  border: 0;
  color: var(--fg-2);
  font-size: 12px;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 6px 4px;
  cursor: pointer;
  white-space: nowrap;
}
.dl-chiprail-link:hover { color: var(--fg); }

.dl-groups { display: flex; flex-direction: column; gap: 20px; }
.dl-group { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 140px; }
.dl-group-hd {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
/* Toggle variant - entire header is the click target. */
.dl-group-hd-toggle {
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border);
  width: 100%;
  cursor: pointer;
  text-align: left;
  padding: 8px 6px 8px 0;
  color: var(--fg);
  font: inherit;
  transition: background 120ms ease;
  border-radius: 0;
}
.dl-group-hd-toggle:hover { background: var(--bg-2); }
html[data-theme="swiss"] .dl-group-hd,
html[data-theme="swiss"] .dl-group-hd-toggle { border-bottom: 2px solid var(--fg); padding-bottom: 6px; }
html[data-theme="playful"] .dl-group-hd,
html[data-theme="playful"] .dl-group-hd-toggle { border-bottom: 2px solid var(--border); }

.dl-group-chevron {
  margin-left: 4px;
  color: var(--fg-3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  transition: transform 180ms ease, color 120ms ease;
}
.dl-group-chevron[data-open="0"] { transform: rotate(-90deg); }
.dl-group-hd-toggle:hover .dl-group-chevron { color: var(--fg); }
.dl-group-hd h2 {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
html[data-theme="swiss"] .dl-group-hd h2 {
  font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--fg);
}
html[data-theme="playful"] .dl-group-hd h2 {
  text-transform: none; font-size: 22px; font-weight: 700;
  font-style: italic; color: var(--fg); letter-spacing: -0.01em;
}
.dl-group-count {
  margin-left: auto;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--fg-3);
  padding: 2px 8px;
  background: var(--bg-2);
  border-radius: 999px;
}
html[data-theme="swiss"] .dl-group-count {
  font-family: var(--font-mono); border-radius: 0; background: var(--fg); color: var(--bg);
  padding: 2px 6px;
}
html[data-theme="playful"] .dl-group-count { background: var(--accent); color: var(--accent-fg); font-weight: 700; }

/* ─── Shelf view ────────────────────────────────────────────────────────── */
.dl-shelves { display: flex; flex-direction: column; gap: 28px; }
.dl-shelf { display: flex; flex-direction: column; }
.dl-shelf-hd {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding-bottom: 10px;
}
.dl-shelf-hd h2 { font-size: inherit; font-weight: inherit; color: var(--fg); }
html[data-theme="swiss"] .dl-shelf-hd h2 { letter-spacing: 0.06em; }
html[data-theme="playful"] .dl-shelf-hd h2 { text-transform: none; font-size: 18px; font-style: italic; }
.dl-shelf-count {
  font-variant-numeric: tabular-nums;
  color: var(--fg-3);
  font-size: 11px;
  margin-left: auto;
}

.dl-shelf-row {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  padding: 0 4px;
  min-height: 280px;
  flex-wrap: wrap;
  row-gap: 12px;
}
.dl-shelf-board {
  height: 6px;
  background: linear-gradient(180deg, var(--fg-2) 0%, var(--fg-3) 100%);
  border-radius: 0 0 4px 4px;
  margin-top: 2px;
  box-shadow: 0 4px 8px rgba(0,0,0,.18);
}
html[data-theme="playful"] .dl-shelf-board { background: var(--accent); height: 8px; box-shadow: 0 6px 0 var(--border); }
html[data-theme="swiss"] .dl-shelf-board { background: var(--fg); height: 4px; border-radius: 0; box-shadow: none; }

.dl-spine {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  padding: 16px 0;
  cursor: pointer;
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  text-align: center;
  letter-spacing: 0.02em;
  flex-shrink: 0;
  transition: transform 140ms cubic-bezier(.3,.7,.4,1), box-shadow 140ms ease;
  box-shadow:
    inset -2px 0 6px rgba(0,0,0,.15),
    inset 2px 0 6px rgba(255,255,255,.08),
    0 2px 6px rgba(0,0,0,.18);
}
.dl-spine[data-dark="0"] { color: #1a1a1a; }
.dl-spine[data-color="White"] { box-shadow: inset 0 0 0 1px rgba(0,0,0,.25), inset -2px 0 6px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.18); }
.dl-spine:hover {
  transform: translateY(-8px);
  box-shadow:
    inset -2px 0 6px rgba(0,0,0,.2),
    inset 2px 0 6px rgba(255,255,255,.1),
    0 10px 16px rgba(0,0,0,.25);
}
.dl-spine::before {
  content: "";
  position: absolute;
  inset: 6px 3px;
  border: 1px solid currentColor;
  opacity: .2;
  pointer-events: none;
}
.dl-spine-rotor {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex: 1;
  min-height: 0;
  max-height: 100%;
  width: 100%;
  padding: 0 4px;
}
.dl-spine-title {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  flex: 0 1 auto;
  max-height: 78%;
}
.dl-spine-author {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.04em;
  opacity: .82;
  flex: 0 1 auto;
  max-height: 28%;
}
.dl-spine-fav {
  position: absolute;
  top: 6px; right: 6px;
  display: inline-flex;
  color: #f5b800;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.35));
}
.dl-spine[data-favorite="1"] { outline: 1px solid color-mix(in oklab, #f5b800 60%, transparent); outline-offset: -1px; }

/* Shelf hover tooltip */
.dl-shelf-tip {
  position: fixed;
  z-index: 80;
  pointer-events: none;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  width: 240px;
  box-shadow: 0 12px 28px rgba(0,0,0,.18);
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: dl-fade 120ms ease;
}
html[data-theme="swiss"] .dl-shelf-tip { border: 1px solid var(--fg); border-radius: 0; }
html[data-theme="playful"] .dl-shelf-tip { border: 2px solid var(--border); box-shadow: 6px 6px 0 var(--border); }
.dl-shelf-tip-cat {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
html[data-theme="swiss"] .dl-shelf-tip-cat { font-family: var(--font-mono); }
.dl-shelf-tip-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.25;
  text-wrap: balance;
}
html[data-theme="swiss"] .dl-shelf-tip-title { font-weight: 700; }
.dl-shelf-tip-author { font-size: 12px; color: var(--fg-2); }
.dl-shelf-tip-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg-2);
  margin-top: 4px;
}
.dl-shelf-tip-notes { font-style: italic; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─── Grid view ─────────────────────────────────────────────────────────── */
/* Physical-library feel: a fixed-height shelf BAND per row keeps metadata
   below visually aligned, but each cover preserves its true aspect ratio
   and sits on the bottom of the band like a real spine on a shelf.
   Placeholders use a stable per-id ratio so a wall of color blocks still
   reads as a varied collection rather than a product grid. */
.dl-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 36px 22px;
  align-items: start;
}
html[data-theme="swiss"] .dl-grid { gap: 40px 22px; }
html[data-theme="playful"] .dl-grid { gap: 44px 26px; }

.dl-grid-card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Shared baseline “shelf” that all covers stand on. */
.dl-grid-band {
  position: relative;
  height: 260px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.dl-grid-band::after {
  content: "";
  position: absolute;
  left: -4px; right: -4px; bottom: -6px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    color-mix(in oklab, var(--fg) 18%, transparent) 12%,
    color-mix(in oklab, var(--fg) 18%, transparent) 88%,
    transparent 100%
  );
  border-radius: 1px;
  opacity: .4;
  pointer-events: none;
}
html[data-theme="swiss"] .dl-grid-band::after {
  background: var(--fg);
  height: 1px;
  opacity: 1;
}

.dl-grid-cover {
  position: relative;
  border: 0;
  padding: 0;
  cursor: pointer;
  overflow: visible;
  background: transparent;
  /* drop-shadow tracks the rendered silhouette (image or color block) */
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.18));
  transition: transform 160ms cubic-bezier(.3,.7,.4,1), filter 160ms ease;
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  max-width: 100%;
  max-height: 100%;
}
.dl-grid-cover:hover {
  transform: translateY(-4px);
  filter: drop-shadow(0 14px 18px rgba(0,0,0,.25));
}
html[data-theme="playful"] .dl-grid-cover { filter: drop-shadow(4px 4px 0 var(--border)); }
html[data-theme="playful"] .dl-grid-cover:hover { transform: translate(-2px, -2px); filter: drop-shadow(6px 6px 0 var(--border)); }

/* Real cover image - keep its true proportions. */
.dl-grid-cover-img { width: auto; height: 100%; max-height: 260px; }
.dl-grid-cover-img img {
  display: block;
  max-width: 100%;
  height: 100%;
  width: auto;
  object-fit: contain;
  border-radius: 1px 2px 2px 1px;
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.18),
    inset -1px 0 0 rgba(0,0,0,.12);
}
html[data-theme="swiss"] .dl-grid-cover-img img { outline: 1px solid var(--fg); outline-offset: -1px; }

/* Placeholder color block - inline width/height/aspect set in JS per id. */
.dl-grid-cover-fb {
  border-radius: 1px 2px 2px 1px;
  min-width: 64px;
  min-height: 160px;
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.22),
    inset -1px 0 0 rgba(0,0,0,.18),
    inset 0 -2px 0 rgba(0,0,0,.12);
  overflow: hidden;
}

/* Star on grid covers */
.dl-grid-star {
  position: absolute;
  top: 8px; right: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border: 0;
  border-radius: 999px;
  background: rgba(0,0,0,.45);
  color: rgba(255,255,255,.85);
  opacity: 0;
  transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.dl-grid-card:hover .dl-grid-star { opacity: 1; }
.dl-grid-star:hover { background: rgba(0,0,0,.65); color: #fff; }
.dl-grid-star.is-on { opacity: 1; background: rgba(0,0,0,.45); color: #f5c63a; }
.dl-grid-fallback {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  padding: 12px 10px;
  color: #fff;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,.55) 100%);
}
.dl-grid-card[data-color="White"] .dl-grid-fallback,
.dl-grid-card[data-color="Yellow"] .dl-grid-fallback {
  color: #1a1a1a;
  background: linear-gradient(180deg, rgba(255,255,255,0) 50%, rgba(0,0,0,.2) 100%);
}
.dl-grid-fallback-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  text-wrap: balance;
}
.dl-grid-fallback-author {
  font-size: 10px;
  font-weight: 500;
  opacity: .85;
  margin-top: 4px;
}

.dl-grid-meta {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.dl-grid-meta h3 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
  /* Keep titles to two lines so the metadata block stays a predictable
     height across the row. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: calc(1.3em * 2);
}
html[data-theme="swiss"] .dl-grid-meta h3 { font-weight: 700; }
html[data-theme="playful"] .dl-grid-meta h3 { font-weight: 700; font-size: 14px; }
.dl-grid-meta p {
  font-size: 11px;
  color: var(--fg-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dl-grid-cat {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  margin-top: 2px;
}
html[data-theme="swiss"] .dl-grid-cat { font-family: var(--font-mono); letter-spacing: 0.06em; }

/* ─── Empty ─────────────────────────────────────────────────────────────── */
.dl-empty {
  padding: 80px 20px;
  text-align: center;
  color: var(--fg-2);
}
.dl-empty p { font-size: 14px; }
.dl-empty-sub { font-size: 12px; color: var(--fg-3); margin-top: 4px; }

/* ─── Modal ─────────────────────────────────────────────────────────────── */
.dl-modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  animation: dl-fade 140ms ease;
}
@keyframes dl-fade { from { opacity: 0; } }
.dl-modal {
  width: 100%;
  max-width: 520px;
  max-height: calc(100vh - 40px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-strong);
  overflow: hidden;
}
html[data-theme="swiss"] .dl-modal { border: 2px solid var(--fg); }
html[data-theme="playful"] .dl-modal { border: 2px solid var(--border); border-radius: var(--radius); box-shadow: 12px 12px 0 var(--border); }
.dl-modal-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 16px 24px;
  border-bottom: 1px solid var(--border);
}
html[data-theme="swiss"] .dl-modal-hd { border-bottom: 2px solid var(--fg); }
.dl-modal-hd h2 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
}
html[data-theme="playful"] .dl-modal-hd h2 { font-weight: 700; font-style: italic; font-size: 20px; }
.dl-modal-body {
  padding: 20px 24px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.dl-modal-ft {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 14px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
  gap: 12px;
}
html[data-theme="swiss"] .dl-modal-ft { border-top: 2px solid var(--fg); }
.dl-modal-ft-actions { display: flex; gap: 8px; }

/* Form fields */
.dl-form-row { display: flex; flex-direction: column; gap: 6px; }
.dl-form-row label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-2);
}
html[data-theme="swiss"] .dl-form-row label { font-family: var(--font-mono); letter-spacing: 0.06em; }
.dl-form-row input, .dl-form-row select {
  width: 100%;
  height: 36px;
  padding: 0 12px;
  font-size: 13px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: 0;
}
html[data-theme="swiss"] .dl-form-row input,
html[data-theme="swiss"] .dl-form-row select { border: 1px solid var(--fg); background: var(--card); }
html[data-theme="playful"] .dl-form-row input,
html[data-theme="playful"] .dl-form-row select { border: 2px solid var(--border); }
.dl-form-row input:focus, .dl-form-row select:focus { border-color: var(--accent); }
.dl-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.dl-cover-row { display: flex; gap: 14px; align-items: stretch; }
.dl-cover-preview {
  width: 80px; aspect-ratio: 2/3;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background-size: cover; background-position: center;
  flex-shrink: 0;
}
.dl-cover-preview span { font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
.dl-cover-actions { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.dl-cover-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.dl-btn-ghost-sm { padding: 0 10px; font-size: 12px; height: 32px; }
.dl-form-err { font-size: 11px; color: var(--danger); }

/* Cover actions inside the drawer hero */
.dl-drawer-cover-actions {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity 140ms ease;
}
.dl-drawer-hero:hover .dl-drawer-cover-actions,
.dl-drawer-cover-actions:focus-within { opacity: 1; }
.dl-drawer-cover-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  background: rgba(0,0,0,.55);
  border: 0;
  border-radius: 999px;
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  cursor: pointer;
}
.dl-drawer-cover-btn:hover { background: rgba(0,0,0,.75); }
.dl-drawer-cover-err {
  position: absolute;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}

/* ─── Detail drawer ────────────────────────────────────────────────────── */
.dl-drawer-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.35);
  display: flex; justify-content: flex-end;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  animation: dl-fade 160ms ease;
}
.dl-drawer {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: dl-slide 220ms cubic-bezier(.2,.7,.2,1);
  box-shadow: -20px 0 40px rgba(0,0,0,.18);
}
@keyframes dl-slide { from { transform: translateX(20px); opacity: 0; } }
html[data-theme="swiss"] .dl-drawer { border-left: 2px solid var(--fg); }

.dl-drawer-hero {
  position: relative;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.dl-drawer-cover {
  max-width: 60%;
  max-height: calc(100% - 40px);
  box-shadow: 0 14px 28px rgba(0,0,0,.3);
  border-radius: 2px;
}
html[data-theme="playful"] .dl-drawer-cover { box-shadow: 8px 8px 0 rgba(0,0,0,.4); border-radius: 4px; }

.dl-drawer-cover-fallback {
  max-width: 70%;
  text-align: center;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 28px;
  background: rgba(0,0,0,.18);
  border-radius: 4px;
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.dl-drawer[data-light-bg] .dl-drawer-cover-fallback { color: #1a1a1a; text-shadow: none; }
.dl-drawer-cover-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.dl-drawer-cover-author { font-size: 12px; opacity: .85; font-weight: 500; }

.dl-drawer-close, .dl-drawer-star {
  position: absolute;
  top: 14px;
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0;
  border-radius: 999px;
  background: rgba(0,0,0,.45);
  color: #fff;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.dl-drawer-close { right: 14px; }
.dl-drawer-star { right: 54px; color: rgba(255,255,255,.85); }
.dl-drawer-close:hover, .dl-drawer-star:hover { background: rgba(0,0,0,.65); color: #fff; }
.dl-drawer-star.is-on { color: #f5c63a; }

.dl-drawer-body {
  padding: 22px 24px 18px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.dl-drawer-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-2);
}
html[data-theme="swiss"] .dl-drawer-eyebrow { font-family: var(--font-mono); letter-spacing: 0.06em; }
.dl-drawer-color { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }

.dl-drawer-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.15;
  text-wrap: balance;
  letter-spacing: -0.015em;
}
html[data-theme="playful"] .dl-drawer-title { font-style: italic; }
.dl-drawer-author { font-size: 14px; color: var(--fg-2); margin-top: -2px; }
html[data-theme="swiss"] .dl-drawer-author { font-family: var(--font-mono); }

.dl-drawer-section h5 {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  margin: 0 0 6px;
}
html[data-theme="swiss"] .dl-drawer-section h5 { font-family: var(--font-mono); }
.dl-drawer-section p { font-size: 13px; color: var(--fg); line-height: 1.5; }

.dl-drawer-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.dl-drawer-meta-grid h5 {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  margin: 0 0 4px;
}
html[data-theme="swiss"] .dl-drawer-meta-grid h5 { font-family: var(--font-mono); }
.dl-drawer-meta-grid p { font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; }
html[data-theme="swiss"] .dl-drawer-meta-grid { border-top: 1px solid var(--fg); }

.dl-drawer-quality { display: flex; flex-direction: column; gap: 3px; }
.dl-drawer-quality li {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--fg-2);
}
.dl-drawer-quality li span { color: var(--fg-3); }

.dl-drawer-ft {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-2);
  gap: 12px;
  flex-shrink: 0;
}
html[data-theme="swiss"] .dl-drawer-ft { border-top: 2px solid var(--fg); }


/* ─── Mobile / narrow viewport ─────────────────────────────────────────── */
@media (max-width: 760px) {
  /* Tighter page padding */
  .dl-header { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
  .dl-tabs { padding: 6px 16px 0; top: 0; }
  .dl-toolbar { padding: 12px 16px 0; }
  .dl-main { padding: 16px 16px 80px; }

  /* Header: two rows. Title row on top, search + add below.
     Use flex-basis 100% (with grow:0) - desktop's `flex:1` shorthand
     overrides plain `width`, so we have to win at the flex layer. */
  .dl-header-left,
  .dl-header-right {
    flex: 1 0 100%;
    width: 100%;
    min-width: 0;
  }
  .dl-header-left { gap: 12px; }
  .dl-header-right { gap: 8px; }
  .dl-search { width: auto; flex: 1; min-width: 0; }
  .dl-add { flex-shrink: 0; padding: 0 12px; }
  .dl-title { font-size: 16px; }
  .dl-eyebrow { font-size: 10px; }
  .dl-count {
    margin-left: auto;
    padding-left: 0;
    border-left: 0;
    font-size: 11px;
    flex-shrink: 0;
  }

  /* Tabs scroll horizontally so all 5 always fit */
  .dl-tabs {
    overflow-x: auto;
    scrollbar-width: none;
    flex-wrap: nowrap;
    gap: 0;
  }
  .dl-tabs::-webkit-scrollbar { display: none; }
  .dl-tab { flex-shrink: 0; padding: 10px 12px; font-size: 13px; }
  html[data-theme="swiss"] .dl-tab { font-size: 10px; padding: 12px 10px; }

  /* Sticky offsets: tabs sit right under header naturally, no need to
     pin the chip rail to a hard pixel offset on mobile. */
  .dl-chiprail { top: 0; }
  .dl-chiprail-actions { display: none; } /* hide expand/collapse-all on mobile */

  /* Filters: wrap and use full width pills */
  .dl-filters { gap: 6px; }
  .dl-filter { font-size: 11px; height: 28px; padding: 0 8px 0 10px; }
  .dl-filter-label { display: none; } /* save space; "All categories" is enough */

  /* Cards: a bit shorter, tighter spacing on the right column */
  .dl-card { height: 64px; padding: 0 8px 0 18px; gap: 10px; }
  .dl-card[data-density="compact"] { height: 48px; padding: 0 8px 0 16px; }
  .dl-card-title { font-size: 14px; }
  .dl-card-byline { font-size: 12px; gap: 6px; }
  .dl-card-author { max-width: 60%; }
  /* On phones the right notes column eats title space - drop it. */
  .dl-card-right { display: none; }
  .dl-card-star { opacity: .7; width: 28px; height: 28px; }
  .dl-card-edit { opacity: .7; }

  /* Stats panel: compress summary */
  .dl-stats-toggle { padding: 12px 14px; gap: 10px; }
  .dl-stats-summary { gap: 14px; }
  .dl-stats-summary-n { font-size: 17px; }
  .dl-stats-summary-l { font-size: 9px; }
  .dl-stats-color-bar { flex-basis: 100%; max-width: none; }

  /* Shelf view: smaller spines */
  .dl-shelf-row { min-height: 220px; }
  .dl-spine { padding: 12px 0; }

  /* Grid view: smaller cover stage and tighter columns */
  .dl-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 28px 14px; }
  .dl-grid-band { height: 200px; }
  .dl-grid-cover-img { max-height: 200px; }
  .dl-grid-cover-fb { min-height: 130px; min-width: 56px; }
  .dl-grid-meta h3 { font-size: 12px; min-height: calc(1.3em * 2); }

  /* Drawer: full-width */
  .dl-drawer { max-width: 100%; border-left: 0; }
  .dl-drawer-hero { height: 220px; }
  .dl-drawer-title { font-size: 22px; }

  /* Modal: tighter chrome */
  .dl-modal-body { padding: 16px 18px; gap: 14px; }
  .dl-modal-ft { padding: 12px 14px 12px 18px; }
  .dl-cover-row { flex-direction: column; }
  .dl-cover-preview { width: 100%; aspect-ratio: auto; height: 160px; }
}

/* Extra-tight (phones in portrait, <420px) */
@media (max-width: 420px) {
  .dl-header { padding: 10px 14px; }
  .dl-tabs { padding: 4px 14px 0; }
  .dl-toolbar { padding: 10px 14px 0; }
  .dl-main { padding: 14px 14px 80px; }
  .dl-title { font-size: 15px; }
  .dl-card-title { font-size: 13.5px; }
  .dl-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 24px 12px; }
  .dl-grid-band { height: 170px; }
  .dl-grid-cover-img { max-height: 170px; }
}


/* ═══ Design Vault, public additions ═══ */
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.dl-search:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.dl-search input:focus-visible { outline: 0; }
.dv-anchor { height: 0; }
.dl-main { min-height: 72vh; }

/* ═══ Hero: the shelf on a color field ═══ */
.dv2 {
  --s: 1;
  position: relative;
  overflow: hidden;
  background: var(--field);
  color: var(--ink);
  font-family: "Archivo", "DM Sans", system-ui, sans-serif;
  font-stretch: 100%;
  padding: clamp(28px, 5vh, 52px) 0 clamp(24px, 4vh, 40px);
  transition: background-color 360ms cubic-bezier(.3,.7,.2,1), color 360ms ease;
}
.dv2 button, .dv2 input { font-family: inherit; color: inherit; }
.dv2-wrap {
  max-width: 1400px; margin: 0 auto; padding: 0 28px;
}

.dv2-title {
  margin: 0;
  font-weight: 850;
  font-stretch: 62%;
  text-transform: uppercase;
  font-size: clamp(66px, 18.4vw, 290px);
  line-height: .8;
  letter-spacing: -0.012em;
  margin-left: -0.03em;
  white-space: nowrap;
}

.dv2-intro {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 28px 48px;
  margin-top: clamp(18px, 3.2vh, 34px);
}
.dv2-lede {
  margin: 0; max-width: 46ch;
  font-size: clamp(16px, 1.35vw, 19px); line-height: 1.45; font-weight: 450;
  text-wrap: pretty;
}
.dv2-cta { display: flex; gap: 10px; flex-shrink: 0; }
.dv2-btn {
  height: 46px; padding: 0 22px; font-size: 15px; font-weight: 650; letter-spacing: 0;
  border: 2px solid var(--ink); background: transparent; cursor: pointer; white-space: nowrap;
  transition: background-color 160ms ease, color 160ms ease, transform 120ms ease;
}
.dv2-btn-solid { background: var(--ink); color: var(--field) !important; }
.dv2-btn-line:hover { background: var(--ink); color: var(--field) !important; }
.dv2-btn:active { transform: translateY(1px); }

/* shelf */
.dv2-scroller {
  position: relative;
  margin-top: clamp(16px, 3vh, 30px);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none;
  cursor: grab;
  user-select: none; -webkit-user-select: none;
  overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 64px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 64px), transparent 100%);
}
.dv2-scroller::-webkit-scrollbar { display: none; }
.dv2-scroller:active { cursor: grabbing; }

.dv2-rail {
  position: relative;
  height: calc(340px * var(--s) + 44px);
  margin-left: max(28px, calc((100vw - 1344px) / 2 + 28px));
  margin-right: 80px;
  flex: none;
}
.dv2-group {
  position: absolute; left: 0; top: 0;
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  font-size: 15px; font-weight: 700; white-space: nowrap;
  transition: transform 700ms cubic-bezier(.65,0,.25,1), opacity 300ms ease;
  animation: dv2-fade 600ms ease 700ms backwards;
}
.dv2-group span { font-weight: 450; opacity: .6; margin-left: 7px; }
.dv2-group:hover { text-decoration: underline; text-underline-offset: 4px; }
@keyframes dv2-fade { from { opacity: 0; } }

.dv2-spine {
  position: absolute; left: 0; bottom: 0;
  width: var(--w);
  --sh: calc(var(--h) * var(--s));
  height: var(--sh);
  padding: 0; border: 0; background: none; cursor: pointer;
  transform: translateX(var(--x));
  transition: transform 700ms cubic-bezier(.65,0,.25,1);
  animation: dv2-drop 780ms cubic-bezier(.22,.9,.3,1.08) backwards;
  animation-delay: calc(var(--i) * 13ms);
  -webkit-tap-highlight-color: transparent;
}
.dv2-rail[data-arranging="1"] .dv2-spine { transition-delay: calc(var(--i) * 2ms); }
.dv2-rail[data-arranging="1"] .dv2-book { opacity: .45; }
.dv2-rail[data-arranging="1"] .dv2-group { opacity: 0; }
/* The slot above never moves on hover, so the pointer target stays put while the book lifts. */
.dv2-book {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  translate: var(--px, 0px) var(--py, 0px);
  transition: translate 260ms cubic-bezier(.2,.9,.3,1.15), box-shadow 160ms ease, opacity 450ms ease;
  box-shadow: inset 3px 0 0 rgba(255,255,255,.2), inset -3px 0 0 rgba(0,0,0,.14);
  pointer-events: none;
}
.dv2-book::before, .dv2-book::after {
  content: ""; position: absolute; left: 0; right: 0; height: 3px;
  background: currentColor; opacity: .38;
}
.dv2-book::before { top: 16px; }
.dv2-book::after { bottom: 16px; }
.dv2-spine[data-ink="light"] { color: #fff; }
.dv2-spine[data-ink="dark"] { color: #141414; }
.dv2-spine[data-color="Black"] .dv2-book { background: #1d1d20 !important; }
.dv2-spine[data-kin="1"] .dv2-book { box-shadow: inset 0 0 0 3px var(--ink); }
.dv2-spine[data-lifted="1"] .dv2-book { box-shadow: 0 16px 20px -12px rgba(0,0,0,.5), inset 3px 0 0 rgba(255,255,255,.25), inset -3px 0 0 rgba(0,0,0,.16); }
.dv2-spine:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.dv2-star {
  position: absolute; top: 12px; left: 50%; translate: -50% 0;
  width: 15px; height: 15px; color: currentColor; pointer-events: none;
}
.dv2-spine-title {
  writing-mode: vertical-rl; transform: rotate(180deg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-height: calc(100% - 52px);
  font-size: 15px; font-weight: 720; font-stretch: 78%; letter-spacing: .01em;
  pointer-events: none;
}
@keyframes dv2-drop {
  from { translate: 0 -120vh; rotate: -5deg; opacity: 0; }
  60%  { opacity: 1; }
}

.dv2-board {
  margin: 0 max(28px, calc((100vw - 1344px) / 2 + 28px));
  height: 10px; background: var(--ink); position: relative;
}
.dv2-board span { display: block; height: 100%; background: var(--field); opacity: .55; transform: scaleY(.3); transform-origin: 50% 50%; }

/* bottom row */
.dv2-bottom {
  display: grid; grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 0.9fr);
  align-items: end; gap: 20px 40px; margin-top: 22px;
}
.dv2-peek { min-height: 78px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: 15px; line-height: 1.35; }
.dv2-peek strong {
  font-size: clamp(22px, 2.3vw, 32px); font-weight: 800; font-stretch: 72%;
  text-transform: uppercase; line-height: 1; letter-spacing: 0; margin-bottom: 6px;
}
.dv2-peek span { opacity: .85; }
.dv2-peek .dv2-peek-hint { opacity: .8; font-weight: 450; }

.dv2-arrange { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dv2-arrange-label { font-size: 15px; font-weight: 600; margin-right: 4px; }
.dv2-chip {
  height: 38px; padding: 0 16px; font-size: 14px; font-weight: 600; background: transparent;
  border: 2px solid var(--ink); cursor: pointer; border-radius: 999px;
  transition: background-color 140ms ease, color 140ms ease;
}
.dv2-chip:hover { background: color-mix(in srgb, var(--ink) 14%, transparent); }
.dv2-chip[aria-pressed="true"] { background: var(--ink); color: var(--field) !important; }

.dv2-search { display: flex; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.dv2-search input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  font-size: 18px; font-weight: 500; height: 34px;
}
.dv2-search input::placeholder { color: var(--ink); opacity: .6; }
.dv2-search-go { background: none; border: 0; font-size: 15px; font-weight: 700; cursor: pointer; padding: 4px 0; text-decoration: underline; text-underline-offset: 4px; }
.dv2-search-go:disabled { opacity: .4; cursor: default; }
.dv2 :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.dv2 .dv2-search input:focus-visible { outline: 0; }
.dv2-search:focus-within { box-shadow: 0 4px 0 -2px var(--ink); }

/* drawer: more in this category */
.dv-related { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.dv-related button {
  width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left;
  background: transparent; border: 0; padding: 8px; color: var(--fg); font-size: 13px;
}
.dv-related button:hover { background: var(--bg-2); }
.dv-related-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; align-self: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.dv-related-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-related-author { color: var(--fg-3); font-size: 12px; margin-left: auto; padding-left: 8px; white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.dv-theme-btn { flex-shrink: 0; width: 36px; height: 36px; border: 1px solid var(--border); }
.dl-stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dv-footer { max-width: 1400px; margin: 0 auto; width: 100%; padding: 0 28px 56px; }
.dv-footer p { margin: 0; font-size: 12px; color: var(--fg-3); }
html[data-dark="1"] .dl-dot[data-color="Black"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }

/* responsive */
@media (max-height: 860px) { .dv2 { --s: .86; } }
@media (max-height: 720px) { .dv2 { --s: .7; } }
@media (max-width: 980px) {
  .dv2-bottom { grid-template-columns: 1fr 1fr; }
  .dv2-peek { grid-column: 1 / -1; min-height: 70px; }
  .dl-stats-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .dv2 { --s: .78; }
  .dv2-wrap { padding: 0 16px; }
  .dv2-intro { flex-direction: column; align-items: flex-start; gap: 18px; }
  .dv2-rail { margin-left: 16px; }
  .dv2-bottom { grid-template-columns: 1fr; gap: 20px; }
  .dv2-spine-title { font-size: 14px; }
  .dv-footer { padding: 0 16px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  .dv2, .dv2-spine, .dv2-book, .dv2-group { transition: none !important; animation: none !important; }
}

.dv2-nav {
  display: flex; align-items: center; gap: 14px;
  margin: 0 max(28px, calc((100vw - 1344px) / 2 + 28px));
}
.dv2-nav .dv2-board { flex: 1; margin: 0; }
.dv2 .dv2-arrow {
  flex: none; width: 46px; height: 46px; margin-top: 6px;
  border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
  background: var(--ink); color: var(--field);
  transition: transform 160ms ease, opacity 200ms ease, background-color 360ms ease, color 360ms ease;
}
.dv2 .dv2-arrow:hover:not(:disabled) { transform: scale(1.08); }
.dv2 .dv2-arrow:active:not(:disabled) { transform: scale(.95); }
.dv2 .dv2-arrow:disabled { opacity: .28; cursor: default; }
.dv2 .dv2-arrow:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
@media (max-width: 760px) { .dv2-nav { margin: 0 16px; gap: 10px; } .dv2 .dv2-arrow { width: 42px; height: 42px; } }
.dv2-peek-open {
  margin-top: 10px; align-self: flex-start; padding: 9px 16px; cursor: pointer;
  background: var(--ink); color: var(--field) !important; border: 0; font-weight: 700; font-size: 14px;
}
.dv2-peek-fav { display: inline-flex; align-items: center; gap: 6px; }
.dv-fav-badge { display: inline-flex; align-items: center; gap: 5px; color: #b88700; font-weight: 600; }
.dl-card-star.is-static, .dl-grid-star.is-static { pointer-events: none; opacity: 1; }
.dv2-touch-only { display: none; }
@media (hover: none) { .dv2-touch-only { display: inline-block; } }
@media (hover: none) { .dv2-hover-only { display: none; } }

.dv2-spine[data-dim="1"] .dv2-book { opacity: .62; }
.dv2-spine[data-dim="2"] .dv2-book { opacity: .34; }
.dv2-dots { flex: 1; display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.dv2 .dv2-dot {
  position: relative; width: 22px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer;
}
.dv2 .dv2-dot::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
  border-radius: 50%; background: var(--ink); opacity: .3;
  transition: transform 200ms ease, opacity 200ms ease, background-color 360ms ease;
}
.dv2 .dv2-dot:hover::before { opacity: .6; }
.dv2 .dv2-dot[aria-current="true"]::before { opacity: 1; transform: scale(1.5); }
.dv2 .dv2-dot:focus-visible { outline: 3px solid var(--ink); outline-offset: 0; border-radius: 6px; }

/* category chips */
.dv-cats { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: thin; }
.dv-cat {
  flex: none; height: 32px; padding: 0 13px; border-radius: 16px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--fg);
  font: inherit; font-size: 13px; font-weight: 550; white-space: nowrap;
  transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
}
.dv-cat span { opacity: .55; margin-left: 6px; font-weight: 450; }
.dv-cat:hover { background: var(--card-hover); }
.dv-cat[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dv-cat[aria-pressed="true"] span { opacity: .7; }

/* group names read as buttons when they are the way into the library */
.dv2-group[data-mode="category"], .dv2-group[data-mode="color"], .dv2-group[data-mode="favorites"] {
  top: 2px; padding: 4px 11px; border: 2px solid var(--ink); border-radius: 999px; font-size: 14px;
  transition: transform 700ms cubic-bezier(.65,0,.25,1), opacity 300ms ease, background-color 160ms ease, color 160ms ease;
}
.dv2-group[data-mode="category"]:hover, .dv2-group[data-mode="color"]:hover, .dv2-group[data-mode="favorites"]:hover {
  background: var(--ink); color: var(--field); text-decoration: none;
}
.dv-top { background: none; border: 0; cursor: pointer; color: inherit; padding: 0; }
.dv-top:hover { opacity: .7; }

/* library shelf: several color groups share one board; title sits at the bottom with the author beside it */
.dl-shelf-line { display: flex; align-items: flex-end; gap: 44px; padding: 0 4px; }
.dl-shelf-group { display: flex; flex-direction: column; flex: none; max-width: 100%; }
.dl-shelf-group .dl-shelf-row { min-height: 312px; flex-wrap: wrap; padding: 0; }
.dl-spine { justify-content: flex-end !important; padding: 0 !important; }
.dl-spine-rotor {
  flex: none !important; width: auto !important; max-height: none !important; gap: 0 !important;
  display: block !important; padding: 0 !important;
  writing-mode: vertical-rl; transform: rotate(180deg);
  margin: 0 0 16px; height: calc(100% - 32px); max-width: 100%;
  display: flex !important; flex-direction: column !important; align-items: flex-start !important; justify-content: flex-start !important;
  gap: 5px !important;
}
.dl-spine-title, .dl-spine-author {
  writing-mode: vertical-rl; transform: none !important; max-height: 100% !important;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
}
.dl-spine-title { font-size: 13px !important; line-height: 1.25; }
.dl-spine-author { font-size: 11px !important; line-height: 1.25; opacity: .78; font-weight: 500; }
.dl-spine-author[data-missing="1"] { opacity: .5; font-style: italic; }
.dl-spine-fav { top: 8px !important; }
@media (max-width: 760px) { .dl-shelf-line { gap: 28px; } }

/* hero spines: same anatomy */
.dv2-book { align-items: flex-end; }
.dv2-spine-text {
  position: absolute; left: 0; right: 0; bottom: 24px; margin: 0 auto; width: max-content; max-width: 100%;
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; flex-direction: column; gap: 5px; pointer-events: none;
  max-height: calc(var(--sh) - 66px);
